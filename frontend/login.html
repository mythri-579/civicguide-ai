<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CivicGuide AI - Admin Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="app-header">
    <h1>CivicGuide AI</h1>
    <p>Admin Login</p>
  </header>

  <main class="admin-container">
    <section class="upload-section" style="max-width: 400px; margin: 0 auto;">
      <h2 id="formTitle">Login</h2>

      <form id="loginForm" class="upload-form">
        <label for="email">Email <span class="required">*</span></label>
        <input type="email" id="email" name="email" required />

        <label for="password">Password <span class="required">*</span></label>
        <input type="password" id="password" name="password" required />

        <div id="fullNameGroup" class="hidden">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" name="full_name" />
        </div>

        <button type="submit" id="submitBtn">Login</button>
      </form>

      <p style="margin-top: 14px; font-size: 13px; text-align: center;">
        <a href="#" id="toggleModeLink">Don't have an account? Sign up</a>
      </p>

      <div id="loginStatus" class="upload-status hidden"></div>
    </section>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
